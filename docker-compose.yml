services:
  api:
    image: hashicorp/http-echo:latest
    command: ["-text=Monitoring Service Active", "-listen=:5678"]
    networks:
      - monitoring
 
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - monitoring
 
networks:
  monitoring:
    driver: bridge
