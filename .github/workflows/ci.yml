name: CI - Monitoring Scripts
 
on:
  pull_request:
    branches:
      - main
 
jobs:
  validate-scripts:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh
 
      - name: Test API check script
        run: bash check_api.sh https://httpbin.org/status/200
